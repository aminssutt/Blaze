[project]
name = "blaze-backend"
version = "0.1.0"
description = "BLAZE platform backend — FastAPI app, SSE streaming, data adapters"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.22",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# App, not a library: installing this project just pulls the dependencies.
# Run uvicorn/pytest from the repo root (backend.* imports resolve from there).
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
