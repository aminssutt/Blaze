[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaze-backend"
version = "0.1.0"
description = "BLAZE backend — FastAPI app: config, health, routers (incident, approval, dispatch)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "loaders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
