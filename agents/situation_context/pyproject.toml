[project]
name = "blaze-agent-situation-context"
version = "0.1.0"
description = "BLAZE Agent 2 — Situation Context: territorial tool selection + provenance-guarded SituationSnapshot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Imported as `agents.situation_context.*` from the repo root (namespace package).
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
