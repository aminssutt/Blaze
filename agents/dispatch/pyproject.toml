[project]
name = "blaze-agents-dispatch"
version = "0.1.0"
description = "BLAZE Agent 5 — Dispatch: approved-plan-only per-unit French radio messages with deterministic anti-invention guardrails"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Imported as `agents.dispatch.*` from the repo root (namespace package).
# Installing this project just pulls the dependencies; run pytest from agents/dispatch.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
